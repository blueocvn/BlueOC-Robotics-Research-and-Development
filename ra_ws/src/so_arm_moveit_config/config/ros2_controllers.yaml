# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    arm_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController


    hand_group_controller:
      type: position_controllers/GripperActionController


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_group_controller:
  ros__parameters:
    joints:
      - Rotation
      - Pitch
      - Elbow
      - Wrist_Pitch
      - Wrist_Roll
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true
hand_group_controller:
  ros__parameters:
    joint: Jaw
    # Real gripper: the Jaw can't always reach the exact commanded position — it
    # hits its open limit or stalls on a grasped object. Treat a stall as success
    # (instead of ABORTing) and loosen the goal tolerance so the ~2 deg it stops
    # short of a full-open command still counts as reached.
    allow_stalling: true
    goal_tolerance: 0.05
    stall_velocity_threshold: 0.005
    stall_timeout: 1.0