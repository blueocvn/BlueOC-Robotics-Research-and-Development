# SLAM occupancy map shown behind the /admin map editor (ROS map_server format).
# Copied from amr/jetracer_ws/maps/test_map_outer_v6. Coordinates in the editor are
# this map's frame, so dock/obstacle poses are exactly what the robot navigates in.
# display_rotation_deg (optional): level the view; omit to auto-level the walls.
image: slam_map.pgm
resolution: 0.05
origin: [-8.31, -4.29, 0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.25
