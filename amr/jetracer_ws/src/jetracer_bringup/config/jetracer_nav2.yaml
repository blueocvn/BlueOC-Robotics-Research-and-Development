amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 6.0
    laser_min_range: 0.15
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 800
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    # Auto-seed the pose at the origin on startup so map->odom is published
    # immediately (no manual "2D Pose Estimate" needed for testing).
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/ros2_ws/src/jetracer_bringup/config/navigate_w_recovery.xml"
    default_nav_through_poses_bt_xml: "/ros2_ws/src/jetracer_bringup/config/navigate_w_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Planner-agnostic: the default planner (NavFn) can't guarantee heading and the
      # car can't rotate in place, so don't grind on yaw -- the docker's K-turn pivot
      # owns final heading. xy tightened to 0.25 (better staging placement, achievable
      # by both planners). Even when SmacHybrid is selected we don't enforce its yaw
      # here; its value is a feasible/smooth (possibly reversing) path, not the final
      # yaw, which the tag-based approach re-corrects anyway.
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 1.57
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Transit speed bumped to 0.44 (~2x) for faster navigation. TRADEOFF: the A1
      # scan spans ~100 ms and motion smear scales with speed (worst-case angular
      # vel = desired_linear_vel * max_curvature), so localization/costmaps are
      # noisier than at the old 0.22 -- if AMCL drifts or it clips corners, walk
      # this back down. Mapping (jetracer_mapping.yaml) stays at 0.22 for map quality.
      desired_linear_vel: 0.44
      # Longer lookahead than 0.4 to keep the path smooth at the higher speed
      # (velocity-scaled lookahead is off, so this is a fixed distance).
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      # Follow reverse legs produced by the Reeds-Shepp Hybrid-A* plan. (RPP forbids
      # allow_reversing together with use_rotate_to_heading:true; rotate_to_heading is
      # off here -- the car can't rotate in place -- so this is legal.) Set back to
      # false (and the planner to DUBIN) to go forward-only.
      allow_reversing: true
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Rectangular chassis footprint (was robot_radius: 0.15, too small for a
      # ~1/10 car and lets Smac clip the spot edges). ESTIMATE ~0.34m x 0.18m,
      # assumed centered on base_footprint -- VERIFY origin/dims on hardware.
      footprint: "[[0.17, 0.09], [0.17, -0.09], [-0.17, -0.09], [-0.17, 0.09]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.3
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Rectangular chassis footprint (was robot_radius: 0.15, too small for a
      # ~1/10 car and lets Smac clip the spot edges). ESTIMATE ~0.34m x 0.18m,
      # assumed centered on base_footprint -- VERIFY origin/dims on hardware.
      footprint: "[[0.17, 0.09], [0.17, -0.09], [-0.17, -0.09], [-0.17, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.3
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    # Two planners loaded at once; the BT's PlannerSelector picks per-replan (see
    # navigate_w_recovery.xml). jetracer_docker publishes to /planner_selector to
    # switch: SmacHybrid for the tight staging maneuver, GridBased (NavFn) for
    # everything else. Switching is seamless -- the planner is stateless between
    # the 1 Hz replans.
    planner_plugins: ["GridBased", "SmacHybrid"]

    # GridBased = NavFn (Dijkstra): cheap, forward-only. The generic default --
    # long open transit, manual RViz goals, and the fallback the other BT XMLs
    # (minimal_bt.xml / navigate_no_recovery.xml) hardcode as planner_id.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

    # SmacHybrid = Smac Hybrid-A* (kinodynamic): plans in (x, y, heading) respecting
    # the car's minimum turning radius, and with REEDS_SHEPP can plan forward+reverse
    # maneuvers to reach the staging pose at the RIGHT HEADING -- what NavFn can't do.
    # Heavier, so it's selected only for the last stretch into the dock.
    SmacHybrid:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5                      # m, distance at which the goal counts as reached
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0              # s, bound Jetson planning cost
      # REEDS_SHEPP allows reverse legs (needed to line up heading in tight space).
      # Switch to DUBIN for forward-only if reversing misbehaves on hardware.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      # L / tan(delta_max) = 0.165 / tan(30deg) ~= 0.29 m; 0.35 leaves margin so the
      # planner never asks for a turn tighter than the car can physically drive.
      minimum_turning_radius: 0.35
      reverse_penalty: 2.0               # prefer forward; reverse only when it helps
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false    # goal moves between replans -> don't cache
      smooth_path: false                 # constrained smoother (below) owns smoothing
      allow_primitive_interpolation: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true

# Constrained smoother -- the "NMPC/QP smoothing" optimisation stage. Takes the
# raw Smac Hybrid-A* primitive path and refines it into a smooth, minimum-curvature
# trajectory that still honours the car's turning radius (Ceres nonlinear
# least-squares). Invoked from the BT via <SmoothPath smoother_id="constrained_smoother">.
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["constrained_smoother"]
    constrained_smoother:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      reversing_enabled: true            # keep reverse cusps from the Reeds-Shepp plan
      path_downsampling_factor: 3
      path_upsampling_factor: 1
      keep_start_orientation: true
      keep_goal_orientation: true
      minimum_turning_radius: 0.35        # must match the planner's radius
      w_curve: 30.0                       # curvature (turning-radius) penalty
      w_dist: 0.0                         # stay-close-to-input penalty
      w_smooth: 2000000.0                 # smoothness (dominant term)
      w_cost: 0.015                       # push away from obstacles
      # cost_check_points intentionally omitted: an empty YAML list ([]) has no
      # inferable type and makes rclcpp throw InvalidParameterValueException
      # ("No parameter value set") at node construction, crashing smoother_server
      # before it can advertise get_state. The plugin default is already empty.
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tolerance: 1.0e-10
        fn_tolerance: 1.0e-7
        param_tolerance: 1.0e-15
        advanced:
          min_line_search_step_size: 1.0e-20
          max_num_line_search_step_size_iterations: 50
          line_search_sufficient_function_decrease: 1.0e-20
          max_num_line_search_direction_restarts: 20
          max_line_search_step_contraction: 1.0e-3
          min_line_search_step_contraction: 0.6
          line_search_type: "WOLFE"

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # No "spin" behavior: the JetRacer is Ackermann-steered and cannot rotate in place.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
