# opennav_docking (humble backport) config for the JetRacer.
#
# Loaded as a second params file alongside jetracer_nav2.yaml. Three docks
# (dock0/1/2) correspond to AprilTag 36h11 ids 0/1/2. Detection is external:
# dock_pose_publisher republishes the visible tag's TF as /detected_dock_pose,
# and SimpleChargingDock closes the loop on it.
#
# NOTE: this humble branch (v0.0.2) ships only SimpleChargingDock -- there is no
# SimpleNonChargingDock. For the non-charging JetRacer we run it with
# use_battery_status:false and use_stall_detection:false, so "docked" is decided
# purely by reaching docking_threshold of the detected dock pose.
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0          # 50 (default) is heavy for the Jetson
    initial_perception_timeout: 5.0
    wait_charge_timeout: 2.0            # no real charger; keep short
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.10
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    odom_topic: "/odometry/filtered"    # EKF output, as used elsewhere
    dock_backwards: false               # front-mounted camera -> drive forward in
    dock_prestaging_tolerance: 0.5

    # Smooth control law tuned for Ackermann (not diff-drive).
    # k_phi=0 removes the spiral/heading-alignment arc that causes L-shaped
    # approaches on car-like robots. k_delta low = gentle proportional steering.
    controller:
      k_phi: 0.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.12                # slow final approach; Ackermann needs more time
      v_angular_max: 0.75
      slowdown_radius: 0.25             # start slowing within 25 cm of target
      # Disable costmap collision checking during the approach for now to keep
      # the docking server independent of the local costmap; revisit if needed.
      use_collision_detection: false
      transform_tolerance: 0.2

    dock_plugins: ["jetracer_dock"]
    jetracer_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      use_battery_status: false         # non-charging robot
      use_stall_detection: false
      use_external_detection_pose: true
      external_detection_timeout: 1.0
      # Corrections from the camera-optical detection convention into the dock
      # approach frame. Defaults assume a forward optical frame; tune on hardware.
      external_detection_translation_x: -0.20
      external_detection_translation_y: 0.0
      # π: AprilTag publishes pose with heading pointing out of the tag (toward camera).
      # For docking, target heading must point back toward robot so the 0.25m offset
      # in docking_server.cpp projects the target closer, not further away.
      external_detection_rotation_yaw: 3.14159
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_roll: -1.57
      filter_coef: 0.1
      docking_threshold: 0.15           # declare docked at 15 cm; prevents overshoot reversal
      staging_x_offset: -0.7            # stage 0.7 m in front of the dock
      staging_yaw_offset: 0.0

    # Dock instances. Poses are [x, y, theta] in `frame`; fill with each tag's
    # surveyed pose in the map. Staging is derived from these; final alignment
    # comes from the live AprilTag detection.
    docks: ["dock0", "dock1", "dock2"]
    dock0:
      type: "jetracer_dock"
      frame: "map"
      pose: [0.0, 0.0, 0.0]
    dock1:
      type: "jetracer_dock"
      frame: "map"
      pose: [0.0, 0.0, 0.0]
    dock2:
      type: "jetracer_dock"
      frame: "map"
      pose: [0.0, 0.0, 0.0]
