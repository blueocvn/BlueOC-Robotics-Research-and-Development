# Nav2 params for the autonomous MAPPING stack (mapping_bringup.launch.py).
#
# Differs from jetracer_nav2.yaml (the navigation config):
#   * NO amcl / map_server sections -- during mapping a live SLAM stack
#     publishes /map and the map->odom TF. The global costmap's static_layer
#     takes /map straight from SLAM; SLAM (not amcl) owns map->odom.
#   * lifecycle_manager node list is the motion stack only (no map_server/amcl).
#   * Inflation is tuned AGGRESSIVE (inflation_radius 0.25, cost_scaling_factor
#     5.0) so the car can hug walls and close off map edges during exploration.
#     Footprint corner is sqrt(0.17^2+0.09^2) ~= 0.19 m, so 0.25 leaves ~6 cm of
#     clearance past the chassis -- do not drop below ~0.22.
#
# Pairs with explore.yaml (explore_lite frontier exploration).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    default_server_timeout: 20
    default_nav_to_pose_bt_xml: "/ros2_ws/src/jetracer_bringup/config/navigate_w_recovery.xml"
    default_nav_through_poses_bt_xml: "/ros2_ws/src/jetracer_bringup/config/navigate_w_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40          # "near enough" - a car can't fine-position; let it stop
      yaw_goal_tolerance: 1.57         # ~90deg: don't grind on heading at all; pivot owns it
      stateful: true

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Lowered from 0.3 to shrink A1 motion smear: the scan spans ~100 ms and
      # worst-case angular vel = desired_linear_vel * max_curvature (no in-place
      # rotation since use_rotate_to_heading=false), so capping speed caps smear.
      desired_linear_vel: 0.22
      lookahead_dist: 0.4
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      use_rotate_to_heading: false
      allow_reversing: false           # forward-only transit; pivot does the turning
      max_robot_pose_search_dist: 10.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Rectangular chassis footprint (was robot_radius: 0.15, too small for a
      # ~1/10 car and lets Smac clip the spot edges). ESTIMATE ~0.34m x 0.18m,
      # assumed centered on base_footprint -- VERIFY origin/dims on hardware.
      footprint: "[[0.17, 0.09], [0.17, -0.09], [-0.17, -0.09], [-0.17, 0.09]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.25
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Rectangular chassis footprint (was robot_radius: 0.15, too small for a
      # ~1/10 car and lets Smac clip the spot edges). ESTIMATE ~0.34m x 0.18m,
      # assumed centered on base_footprint -- VERIFY origin/dims on hardware.
      footprint: "[[0.17, 0.09], [0.17, -0.09], [-0.17, -0.09], [-0.17, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.25
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    # NavFn (Dijkstra): forward-only, no reversing cusps -> just drives the car to
    # an APPROXIMATE staging pose without the Smac back-and-forth. Heading at the
    # staging pose is then handled by jetracer_docker's K-turn search pivot, not the
    # planner. Keeping the id "GridBased" means the BT XMLs/docking staging phase
    # pick it up unchanged.
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # No "spin" behavior: the JetRacer is Ackermann-steered and cannot rotate in place.
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    # Motion stack only -- no map_server/amcl while mapping (SLAM owns /map + TF).
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
    bond_timeout: 4.0
    attempt_respawn_reconnection: true
    bond_respawn_max_duration: 10.0
