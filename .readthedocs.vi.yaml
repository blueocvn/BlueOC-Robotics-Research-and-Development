# Read the Docs build config -- VIETNAMESE translation.
#
# This file is NOT used by the main (English) project. It belongs to a second
# Read the Docs project that:
#   1. points at this same Git repository,
#   2. has Settings > Language set to "Vietnamese",
#   3. has Advanced Settings > "Path for .readthedocs.yaml" set to
#      ".readthedocs.vi.yaml"  (that is what makes RTD read this file),
#   4. is registered on the ENGLISH project under Admin > Translations.
#
# Once linked, RTD serves it at /vi/ under the main project's domain and adds
# the language selector to the flyout menu.
#
# No pre_build job here: the Vietnamese API page links to the generated English
# route reference rather than rendering openapi.json itself, so there is
# nothing to generate.

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: docs/mkdocs.vi.yml

python:
  install:
    - requirements: docs/requirements.txt
