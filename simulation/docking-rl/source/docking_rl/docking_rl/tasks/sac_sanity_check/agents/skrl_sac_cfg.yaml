# SAC config sanity check: byte-for-byte identical agent/model settings to
# docking_rl/tasks/staging_dock/agents/skrl_sac_cfg.yaml (same learning rate, network, discount,
# grad_norm_clip, log_std bounds, rewards_shaper_scale), applied instead to Isaac Lab's own
# unmodified Cartpole task. Purpose: isolate whether the Q-value/critic divergence seen on
# JetRacer-Dock-Staging-v0 (already proven independent of reward design -- see that task's
# RewardsCfg docstring) comes from this SAC *config* itself, or from something specific to the
# JetRacer environment/action term. If this ALSO diverges, the config is the problem, independent
# of environment. If it stays stable, go bug-hunt the docking task's environment/action term
# instead of the SAC settings.

seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 1.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 100000

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 256
  discount_factor: 0.97
  polyak: 0.005
  learning_rate: 1.0e-04
  random_timesteps: 2000
  learning_starts: 2000
  grad_norm_clip: 1.0
  rewards_shaper_scale: 0.1
  learn_entropy: True
  initial_entropy_value: 0.01
  target_entropy: null
  experiment:
    directory: "sac_sanity_check_cartpole"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 500000
  environment_info: log
