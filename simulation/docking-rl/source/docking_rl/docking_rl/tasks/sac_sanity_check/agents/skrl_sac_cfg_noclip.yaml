# Same as skrl_sac_cfg.yaml and same BoundedActionCartpoleEnv (bounded [-1,1] gym action space),
# EXCEPT clip_actions: False. Isolates whether skrl's internal action-clipping step itself (which
# reads min/max from our CUSTOM-overridden action space, not skrl's own natural construction) is
# the specific broken link -- as opposed to some other hyperparameter, or the bounded-space
# override generally. Caveat: with clip_actions False, sampled Gaussian actions reach the env
# unclamped, so cartpole's action term (which has no internal clamp, unlike AckermannAction) could
# occasionally receive somewhat larger effort commands than intended -- a minor confound, but not
# expected to itself cause the kind of runaway numerical divergence under test here.

seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: False
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 1.0
    initial_log_std: 0.0
    network:
      - name: net
        input: OBSERVATIONS
        layers: [128, 128]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: concatenate([OBSERVATIONS, ACTIONS])
        layers: [128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 100000

agent:
  class: SAC
  gradient_steps: 1
  batch_size: 256
  discount_factor: 0.97
  polyak: 0.005
  learning_rate: 1.0e-04
  random_timesteps: 2000
  learning_starts: 2000
  grad_norm_clip: 1.0
  rewards_shaper_scale: 0.1
  learn_entropy: True
  initial_entropy_value: 0.01
  target_entropy: null
  experiment:
    directory: "sac_sanity_check_cartpole_noclip"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 500000
  environment_info: log
