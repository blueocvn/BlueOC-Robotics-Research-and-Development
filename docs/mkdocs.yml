site_name: BlueOC Robotics

nav:
  - Home: index.md
  - Get Started: GET-STARTED.md
  - Robots:
      - Robot Arm (RA):
          - Core Concepts: ra_concepts.md
          - Setup Guide: ra_setup.md
          - Use Cases:
              - Pick and Place: ra_pick_and_place.md
              - Visual Servoing: ra_visual_servoing.md
      - JetRacer (AMR):
          - Core Concepts: amr_concepts.md
          - Setup Guide: amr_setup.md
          - Use Cases:
              - Navigate & Deliver: amr_pick_and_place.md
  - Robotic Solutions:
      - Pick and Deliver (RA + AMR):
          - Overview: solution_pick_and_deliver.md
          - Orchestrator: orchestrator.md
  - Reference:
      - Calibration: CALIBRATION.md
      - Third-party Setup: THIRDPARTY_SETUP.md
      - Getting Started (legacy): GETTING_STARTED.md

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    # Light mode — robot_arm_mt.html palette (white surfaces, blue accent)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode — jetracer-mt.html palette (deep navy, cyan accent)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
