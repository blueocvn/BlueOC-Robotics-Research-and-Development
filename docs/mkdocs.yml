site_name: BlueOC Robotics

nav:
  - Home: index.md
  - Get Started: GET-STARTED.md
  - Robots:
      - Robot Arm (RA):
          - Overview: ra_concepts.md
          - Setup Guide: ra_setup.md
          - Real-Hardware Bringup: ra_hardware_bringup.md
          - Camera Calibration: ra_camera_calibration.md
          - Use Cases:
              - Pick and Place: ra_pick_and_place.md
              - Visual Servoing: ra_visual_servoing.md
              - Imitation Learning: ra_imitation_learning.md
      - JetRacer (AMR):
          - Overview: amr_concepts.md
          - Setup Guide: amr_setup.md
          - Use Cases:
              - Navigate & Deliver: amr_pick_and_place.md
  - Robotic Solutions:
      - Pick and Deliver (RA + AMR):
          - Overview: solution_pick_and_deliver.md
          - Orchestrator: orchestrator.md
  - API Book:
      - Overview: api/index.md
      - HTTP API: api/http.md
      - ROS 2 — JetRacer: api/ros-jetracer.md
      - ROS 2 — Robot Arm: api/ros-arm.md
      - Launch Entry Points: api/launch.md
  - Reference:
      - Calibration: CALIBRATION.md
      - Third-party Setup: THIRDPARTY_SETUP.md
      - MkDocs: mkdocs.md
      - Getting Started (legacy): GETTING_STARTED.md

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    # Hover an internal link -> preview the target page, the Read the Docs
    # "link previews" behaviour the PM asked for. Formerly Insiders-only;
    # free for everyone since mkdocs-material 9.7.0. Requires navigation.instant.
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    # Light mode — robot_arm_mt.html palette (white surfaces, blue accent)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode — jetracer-mt.html palette (deep navy, cyan accent)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# README.md here is an unrelated Isaac Lab RL note that has never rendered --
# it collides with index.md. Excluding it explicitly silences the warning and
# lets CI run --strict.
exclude_docs: |
  README.md

extra_css:
  - stylesheets/extra.css
  - stylesheets/openapi.css

plugins:
  - search
  # Renders docs/api/openapi.json into native Markdown -- themed, searchable and
  # preview-able, unlike an embedded Swagger UI iframe. Spec is regenerated by
  # docs/scripts/gen_openapi.py.
  - neoteroi.mkdocsoad:
      # Emit pymdownx-flavoured markup (tabbed request/response blocks) rather
      # than plain markdown -- matches the rest of the Material theme.
      use_pymdownx: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
