[project]
name = "robot-fulfillment-docs"
version = "0.0.0"
description = "Documentation site for Robot Fulfillment (MkDocs + Material)"
# >=3.10 because neoteroi-mkdocs pulls essentials-openapi, which drops 3.9.
# CI builds on 3.12, so this costs us nothing.
requires-python = ">=3.10"
dependencies = [
    # >=9.7 for navigation.instant.preview (hover link previews) -- that feature
    # was Insiders-only until 9.7.0 made every Insiders feature free.
    "mkdocs-material>=9.7",
    # Renders docs/api/openapi.json into the API book.
    "neoteroi-mkdocs>=1.2",
]

[project.optional-dependencies]
# Needed only to regenerate docs/docs/api/openapi.json from the FastAPI app.
# No ROS required -- robot_web_bridge falls back to its simulated backend.
openapi = [
    "fastapi",
    "jinja2",
    "pyyaml",
    "python-multipart",
]
