# MkDocs config -- VIETNAMESE.
#
# Same theme and styling as mkdocs.yml, but docs_dir points at vi_doc/ instead
# of docs/. Read the Docs builds this as a SEPARATE project whose language is
# set to Vietnamese, then links it to the English project as a translation --
# that is how RTD serves it under /vi/ with a language selector.
#
# Keep the theme block in sync with mkdocs.yml when it changes.

site_name: BlueOC Robotics
site_description: Tài liệu tiếng Việt — BlueOC Robotics

docs_dir: vi_doc

nav:
  - Trang chủ: index.md
  - Bắt đầu: GET-STARTED.md
  - Robot:
      - Cánh tay robot (RA):
          - Tổng quan: ra_concepts.md
          - Hướng dẫn cài đặt: ra_setup.md
          - Khởi chạy phần cứng thật: ra_hardware_bringup.md
          - Hiệu chuẩn camera: ra_camera_calibration.md
          - Trường hợp sử dụng:
              - Gắp và đặt: ra_pick_and_place.md
              - Visual Servoing: ra_visual_servoing.md
              - Imitation Learning: ra_imitation_learning.md
      - JetRacer (AMR):
          - Tổng quan: amr_concepts.md
          - Hướng dẫn cài đặt: amr_setup.md
          - Cài đặt trên thiết bị: amr_jetracer_setup.md
          - Trường hợp sử dụng:
              - Điều hướng & Giao hàng: amr_pick_and_place.md
  - Giải pháp robot:
      - Gắp và giao (RA + AMR):
          - Tổng quan: solution_pick_and_deliver.md
          - Bộ điều phối: orchestrator.md
  - Sổ tay API:
      - Tổng quan: api/index.md
      - API HTTP: api/http.md
      - ROS 2 — JetRacer: api/ros-jetracer.md
      - ROS 2 — Cánh tay robot: api/ros-arm.md
      - Điểm khởi chạy: api/launch.md
  - Tham khảo:
      - Hiệu chuẩn: CALIBRATION.md
      - Cài đặt bên thứ ba: THIRDPARTY_SETUP.md
      - MkDocs: mkdocs.md
      - Bắt đầu (bản cũ): GETTING_STARTED.md

# README.md is written for people browsing the folder on GitHub, not for the
# built site -- excluding it explicitly avoids the index.md conflict warning.
exclude_docs: |
  README.md

theme:
  name: material
  language: vi
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

extra_css:
  - stylesheets/extra.css

plugins:
  # No neoteroi.mkdocsoad here: the Vietnamese HTTP page links to the generated
  # English reference instead of rendering the spec itself.
  - search:
      lang: vi

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Vietnamese headings are non-ASCII; the default slugify strips them and
      # would collapse anchors to empty or colliding ids.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
