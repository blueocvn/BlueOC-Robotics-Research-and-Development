# MkDocs config -- VIETNAMESE.
#
# Same theme and styling as mkdocs.yml, but docs_dir points at vi_doc/ instead
# of docs/. Read the Docs builds this as a SEPARATE project whose language is
# set to Vietnamese, then links it to the English project as a translation --
# that is how RTD serves it under /vi/ with a language selector.
#
# Keep the theme block in sync with mkdocs.yml when it changes.

site_name: BlueOC Robotics
site_description: Tài liệu tiếng Việt — BlueOC Robotics

docs_dir: vi_doc

nav:
  - Home: index.md
  - Get Started: GET-STARTED.md
  - Robots:
      - Robot Arm (RA):
          - Overview: ra_concepts.md
          - Setup Guide: ra_setup.md
          - Real-Hardware Bringup: ra_hardware_bringup.md
          - Camera Calibration: ra_camera_calibration.md
          - Use Cases:
              - Pick and Place: ra_pick_and_place.md
              - Visual Servoing: ra_visual_servoing.md
              - Imitation Learning: ra_imitation_learning.md
      - JetRacer (AMR):
          - Overview: amr_concepts.md
          - Setup Guide: amr_setup.md
          - On-device Setup: amr_jetracer_setup.md
          - Use Cases:
              - Navigate & Deliver: amr_pick_and_place.md
  - Robotic Solutions:
      - Pick and Deliver (RA + AMR):
          - Overview: solution_pick_and_deliver.md
          - Orchestrator: orchestrator.md
  - Reference:
      - Calibration: CALIBRATION.md
      - Third-party Setup: THIRDPARTY_SETUP.md
      - MkDocs: mkdocs.md
      - Getting Started (legacy): GETTING_STARTED.md

# README.md is written for people browsing the folder on GitHub, not for the
# built site -- excluding it explicitly avoids the index.md conflict warning.
exclude_docs: |
  README.md

theme:
  name: material
  language: vi
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.preview
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng

extra_css:
  - stylesheets/extra.css

plugins:
  # No neoteroi.mkdocsoad here: the Vietnamese HTTP page links to the generated
  # English reference instead of rendering the spec itself.
  - search:
      lang: vi

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
