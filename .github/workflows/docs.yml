name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
      # The API book's HTTP reference is generated from the bridge's FastAPI
      # app, so a route change there must rebuild the docs.
      - "orchestrator/src/robot_web_bridge/**"
  workflow_dispatch:

# Least-privilege token: read the repo, write to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run supersede an in-progress one, but never cancel a live deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs + Material
        # mkdocs-material >=9.7 is required: navigation.instant.preview (the
        # hover link previews) was Insiders-only before 9.7.0.
        # neoteroi-mkdocs renders the OpenAPI spec into the API book.
        run: pip install "mkdocs-material>=9.7" neoteroi-mkdocs

      - name: Install bridge deps for OpenAPI generation
        # robot_web_bridge.app imports cleanly without ROS (it falls back to a
        # simulated backend), so the spec can be generated in a plain venv.
        run: pip install fastapi jinja2 pyyaml python-multipart

      - name: Regenerate OpenAPI spec
        run: python docs/scripts/gen_openapi.py

      - name: Fail if the committed spec was stale
        # Keeps the in-repo copy honest so local `mkdocs serve` matches CI.
        run: |
          if ! git diff --exit-code -- docs/docs/api/openapi.json; then
            echo "::error::docs/docs/api/openapi.json is stale. Run: python docs/scripts/gen_openapi.py"
            exit 1
          fi

      - name: Build site
        # --strict is now on: broken links fail the build. Getting here needed
        # the 21 dead links in CALIBRATION.md / orchestrator.md fixed (they point
        # at GitHub blob URLs now) and docs/docs/README.md excluded via
        # exclude_docs -- it is an unrelated Isaac Lab RL note that collided with
        # index.md and never rendered.
        run: mkdocs build --strict --config-file docs/mkdocs.yml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4